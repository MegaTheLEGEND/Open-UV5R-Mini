# The web builder and flasher (docs/WEB-FLASHER.md) on GitHub Pages: on every push to main and every tag, or by hand
# (Actions -> Pages -> Run workflow). Each run carries the sources of every tag, every branch's newest commit and the
# newest commits that changed the build, so the page can build any of them. Needs Settings -> Pages -> Source = "GitHub Actions" once. It publishes our sources at
# the chosen commit, the WebAssembly toolchain, compiler-rt's builtins and JieLi's Apache-2.0 libraries; never any
# Baofeng file (the page asks each user for their own stock file and MM9PDY's patch).
name: Pages

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  LLVM_TAG: pi32v2-23.1.6-2
  LLVM_SHA256: b9aa6878a3e9863d54f7dea96ec5dd2e4f438b02a1503f7b042fa601bb5e4c22
  JIELI_SDK_COMMIT: fdc018de81629e21e594d677cf05f87d288be0f0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # every branch and tag: the versions the page offers

      # The toolchain as WebAssembly: about two hours the first time, then from the cache until the script changes.
      - name: Cache llvm.wasm
        id: wasm
        uses: actions/cache@v4
        with:
          path: ~/wasm/out
          key: llvm-wasm-${{ env.LLVM_TAG }}-${{ hashFiles('web/toolchain/*') }}
      - name: Build llvm.wasm
        if: steps.wasm.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build cmake
          LLVM_TAG=$LLVM_TAG sh web/toolchain/build-wasm.sh ~/wasm
          rm -rf ~/wasm/src ~/wasm/wasm ~/wasm/tblgen

      - name: pi32v2-llvm release (builtins, licence)
        run: |
          curl -sSL -o llvm.tar.xz https://github.com/jvitkauskas/pi32v2-llvm/releases/download/$LLVM_TAG/pi32v2-llvm-${LLVM_TAG#pi32v2-}-linux-x64.tar.xz
          echo "$LLVM_SHA256  llvm.tar.xz" | sha256sum -c -
          mkdir -p ~/llvm-release && tar xJf llvm.tar.xz -C ~/llvm-release --strip-components=1

      - name: JieLi's libraries (Apache-2.0)
        run: |
          git init -q ~/jieli && cd ~/jieli
          git remote add origin https://github.com/Jieli-Tech/fw-AC63_BT_SDK.git
          git sparse-checkout set cpu/br23/liba
          git fetch -q --depth 1 origin $JIELI_SDK_COMMIT && git checkout -q FETCH_HEAD
          cd $GITHUB_WORKSPACE && sh tools/sdk/fm_libs.sh ~/jieli

      - name: Make the site
        run: python3 web/tools/mksite.py --toolchain-wasm ~/wasm/out --llvm-release ~/llvm-release -o build/site

      - name: Check the page's make against GNU make
        run: python3 tests/web_make_host.py --commits 20

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
